name: Terraform Workflow with S3 Backend and DynamoDB Locking

on:
  workflow_dispatch:
    inputs:
      backend_bucket:
        description: 'S3 bucket for Terraform state'
        required: true
      backend_key:
        description: 'S3 key for Terraform state'
        required: true
      backend_region:
        description: 'AWS region for S3 bucket'
        required: true
      dynamodb_table:
        description: 'DynamoDB table for state locking'
        required: true

jobs:
  run_terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_BACKEND_BUCKET: ${{ github.event.inputs.backend_bucket }}
          TF_BACKEND_KEY: ${{ github.event.inputs.backend_key }}
          TF_BACKEND_REGION: ${{ github.event.inputs.backend_region }}
          TF_DYNAMODB_TABLE: ${{ github.event.inputs.dynamodb_table }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ env.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.TF_BACKEND_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"
